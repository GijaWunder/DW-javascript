<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 class="frase">?????</h1>
    <p class="paragrafo">?????</p>
    <button class="botao">clique e veja a magica</button>

    <script>

        let frase = document.querySelector('.frase')
        let botao = document.querySelector('.botao')

        let paragrafo = document.querySelector('.paragrafo')

        botao.onclick = function (){
            frase.style.color = "lightpink"
            frase.style.fontSize = "90px"
            frase.textContent = "MORANGUINHO"

            paragrafo.textContent = "Ela é pequenininha e também é bem fofinha..."
            paragrafo.style.fontSize = "30px"

        }

    </script>
    
</body>
</html>
