<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>

        .sucesso{
            background-color: rgb(42, 117, 32);
            color: rgb(255, 255, 255);
        }

        .erro{
            background-color: rgb(159, 29, 29);
            color: rgb(255, 255, 255);
        }

    </style>

    <input type="text" value="">


    <div id="mensagem"></div>

    <script>

        const campoTexto = document.querySelector("input")
        const mensagem = document.querySelector("#mensagem")

        campoTexto.addEventListener("input", ()=>{
            let digitado = campoTexto.value
            mensagem.classList.remove("erro")
            mensagem.classList.remove("sucesso")

            if(digitado == "chocolate"){
                mensagem.innerText = "Meu sabor de sorvate favorito!!!"
                mensagem.classList.add("sucesso")


            }else if(digitado == "flocos"){
                mensagem.innerText = "Flocos e bom demais"
                mensagem.classList.add("sucesso")

            }else if(digitado == "queijo"){
                mensagem.innerText = "que gosto duvidoso..."
                mensagem.classList.add("erro")

            }else{
                mensagem.innerText = "nao temos em nosso cardapio."
                mensagem.classList.add("erro")
            }
        })

    </script>
    
</body>
</html>
