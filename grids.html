<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
    <style>
        [class*="col"]{
            border: solid 1px red;
            text-align: center;
        }

    </style>



</head>
<body>

    <div class="container mt-5"> <!--mt = margin-top-->
        <div class="row">

            <div class="col-lg-3 col-sm-6 col-xs-12">1</div> <!-- col-lg-3 em telas grandes ocupa 4 colunas, col-sm-6 em telas pequenas ocupa metada e col-xs-12 em telas de celular ocupa uma coluna-->
            <div class="col-lg-3 col-sm-6 col-xs-12">2</div>
            <div class="col-lg-3 col-sm-6 col-xs-12">3</div>
            <div class="col-lg-3 col-sm-6 col-xs-12">4</div>

        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
